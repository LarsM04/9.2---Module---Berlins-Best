
<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ontdek de basislay-out van onze Streetfood Berlin city guide.">
  <title>Streetfood Berlin</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#top">STREETFOOD BERLIN</a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Menu openen"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav id="main-nav" aria-label="Hoofdnavigatie">
        <a href="#over">Over de plek</a>
        <a href="#info">Praktische info</a>
        <a href="#route">Route</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- HERO / INTRO -->
    <section class="hero wrap">
      <div class="meta">
        <span>City guide / 01</span>
        <span>Berlin — Kreuzberg</span>
        <span>52°30' N</span>
      </div>

      <div class="hero-title-placeholder">
        <div></div>
        <div></div>
      </div>

      <div class="hero-intro">
        <div class="tagline placeholder"></div>
        <div class="description placeholder"></div>
        <div class="button-placeholder"></div>
      </div>

      <div class="hero-image placeholder"></div>
    </section>

    <!-- OVER DE PLEK -->
    <section id="over" class="intro-section">
      <div class="wrap">
        <div class="kicker placeholder"></div>

        <div class="intro-grid">
          <div class="big-heading placeholder"></div>

          <div class="intro-content">
            <div class="text-lines"></div>
            <div class="text-lines"></div>
            <div class="stat-placeholder"></div>
            <div class="stat-placeholder"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- SLIDESHOW / FOTO'S -->
    <section class="gallery-section">
      <div class="wrap">
        <div class="gallery-heading">
          <div>
            <div class="kicker placeholder"></div>
            <div class="gallery-title placeholder"></div>
          </div>
          <div class="counter placeholder"></div>
        </div>

        <div class="gallery-frame placeholder">
          <div class="gallery-bottom">
            <div class="caption-placeholder"></div>
            <div class="controls-placeholder"></div>
          </div>
        </div>

        <div class="progress">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
    </section>

    <!-- PRAKTISCHE INFORMATIE -->
    <section id="info" class="wrap info-section">
      <div class="kicker placeholder"></div>
      <div class="section-title placeholder"></div>

      <div class="info-grid">
        <article class="info-card">
          <div class="icon-placeholder"></div>
          <div class="card-title placeholder"></div>
          <div class="card-text placeholder"></div>
        </article>

        <article class="info-card">
          <div class="icon-placeholder"></div>
          <div class="card-title placeholder"></div>
          <div class="card-text placeholder"></div>
        </article>

        <article class="info-card accent-card">
          <div class="icon-placeholder"></div>
          <div class="card-title placeholder"></div>
          <div class="card-text placeholder"></div>
        </article>

        <article class="info-card">
          <div class="icon-placeholder"></div>
          <div class="card-title placeholder"></div>
          <div class="card-text placeholder"></div>
        </article>
      </div>
    </section>

    <!-- ROUTE EN KAART -->
    <section id="route" class="route-section">
      <div class="wrap">
        <div class="kicker placeholder"></div>
        <div class="route-title placeholder"></div>

        <div class="route-grid">
          <div class="map-placeholder placeholder"></div>

          <div class="route-card">
            <div class="route-stop placeholder"></div>
            <div class="route-line"></div>
            <div class="route-stop placeholder"></div>
            <div class="route-details placeholder"></div>
            <div class="route-button placeholder"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- EXTRA INFORMATIE -->
    <section class="wrap extra-section">
      <div class="extra-heading placeholder"></div>

      <div class="extra-list">
        <article class="extra-row">
          <div class="number placeholder"></div>
          <div class="row-title placeholder"></div>
          <div class="row-text placeholder"></div>
        </article>

        <article class="extra-row">
          <div class="number placeholder"></div>
          <div class="row-title placeholder"></div>
          <div class="row-text placeholder"></div>
        </article>

        <article class="extra-row">
          <div class="number placeholder"></div>
          <div class="row-title placeholder"></div>
          <div class="row-text placeholder"></div>
        </article>
      </div>
    </section>

    <!-- BRONNEN -->
    <section class="sources-section">
      <div class="wrap">
        <div class="kicker placeholder"></div>
        <div class="sources-title placeholder"></div>

        <div class="sources-grid">
          <div class="source-row placeholder"></div>
          <div class="source-row placeholder"></div>
          <div class="source-row placeholder"></div>
          <div class="source-row placeholder"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-top">
        <div class="footer-logo-placeholder"></div>
        <div class="footer-team-placeholder"></div>
      </div>

      <div class="footer-bottom">
        <div class="footer-link-placeholder"></div>
        <div class="footer-note-placeholder"></div>
      </div>
    </div>
  </footer>
</body>
</html>
